name: Deploy to Cloudflare Pages

on:
  # Every branch builds. Cloudflare Pages treats the project's production
  # branch as production and every other branch as a preview deployment, so a
  # feature branch gets its own URL to check on a phone before it goes live.
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # The calculator's arithmetic used to ship unverified — a dietitian was
    # catching wrong numbers by eye. These are golden-value tests: known
    # inputs, known outputs. A changed formula fails here, before review.
    - name: Test the maths, the links, the dishes, the shell and the whole site
      run: node --test tests/protein-math.test.js tests/dishes.test.js tests/shell.test.js tests/site.test.js

    # dishes.json is the source of truth; the pages are generated from it.
    # An edit that is not rebuilt would ship a page that disagrees with the
    # data every other check is reading.
    - name: Refuse stale dish pages
      run: python3 ops/build-dishes.py --check

    # Below 768px the header nav is display:none, so a page that missed the
    # tab bar is a page nobody on a phone can reach — and it still looks
    # perfectly fine on the laptop where it was written.
    - name: Refuse pages missing the mobile shell
      run: python3 ops/apply-shell.py --check

    # A page that recomputes the maths inline would make the tests meaningless,
    # because they would be checking a copy rather than what ships.
    - name: Refuse a page that bypasses the tested module
      run: |
        if ! grep -q 'src="/js/protein-math.js"' protein-calculator.html; then
          echo "::error::protein-calculator.html no longer loads the tested module."
          exit 1
        fi
        if grep -qE '6\.25 \* heightCm|10 \* weightKg' protein-calculator.html; then
          echo "::error::Mifflin-St Jeor has been reimplemented inline in the page."
          echo "The maths belongs in js/protein-math.js so the tests cover what ships."
          exit 1
        fi
        echo "Page uses the tested module"

    - name: Validate HTML
      run: |
        # Check index.html exists and has content
        if [ ! -f "index.html" ]; then
          echo "❌ index.html missing"
          exit 1
        fi
        
        # Check file size (must have substantial content)
        FILE_SIZE=$(stat -c%s "index.html")
        if [ $FILE_SIZE -lt 5000 ]; then
          echo "❌ index.html too small ($FILE_SIZE bytes), likely thin content"
          exit 1
        fi
        
        echo "✅ HTML validation passed"
    
    - name: Check for required policy files
      run: |
        # Required files for Google AdSense
        for file in privacy.html terms.html; do
          if [ ! -f "$file" ]; then
            echo "❌ Missing $file (required for AdSense)"
            exit 1
          fi
        done
        
        echo "✅ Policy files validated"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Cloudflare Pages
      id: cf
      uses: cloudflare/pages-action@v1
      with:
        branch: ${{ github.ref_name }}
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: glp1-nav
        directory: .
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Report deployment URL
      run: |
        BRANCH="${{ github.ref_name }}"
        if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
          echo "### Production deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://glp1-nav.com" >> $GITHUB_STEP_SUMMARY
        else
          echo "### Preview deploy - branch \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Open on your phone before merging:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.cf.outputs.url }}" >> $GITHUB_STEP_SUMMARY
        fi
        cat $GITHUB_STEP_SUMMARY

  notify:
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify Status
      run: |
        RESULT="${{ needs.deploy.result }}"
        if [ "$RESULT" = "success" ]; then
          echo "Deployment successful"
        elif [ "$RESULT" = "skipped" ]; then
          echo "Deploy skipped (validation-only run) - not a failure"
        else
          echo "Deployment failed"
          exit 1
        fi
